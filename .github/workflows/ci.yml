name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tfg_user
          POSTGRES_PASSWORD: tfg_password
          POSTGRES_DB: tfg_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tfg_user -d tfg_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 26.1.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: API E2E
        run: pnpm test:e2e:api
        env:
          E2E_DATABASE_HOST: 127.0.0.1
          E2E_DATABASE_PORT: 5432
          E2E_DATABASE_USER: tfg_user
          E2E_DATABASE_PASSWORD: tfg_password
          E2E_DATABASE_NAME: tfg_ci_e2e
